name: Build Windows exe (PyQt6)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyQt6 & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Python unit tests
        run: python github_release_tracker.py --test
      - name: Build single-file exe with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --noconsole --onefile --name GitHubReleaseTracker --icon icon.ico --add-data "icon.ico;." github_release_tracker.py
      - name: Hash and verify exe
        shell: pwsh
        run: |
          $v = "2.0.0"
          & tools/release-notes.ps1 -Version $v -Exe dist/GitHubReleaseTracker.exe -Out "dist/release-notes-v$v.md"
          $size = (Get-Item dist/GitHubReleaseTracker.exe).Length
          Write-Host "Version $v, exe size $size bytes"
          if ($size -lt 1000000) { throw "exe is suspiciously small" }
      - uses: actions/upload-artifact@v4
        with:
          name: GitHubReleaseTracker-pyqt6-windows
          path: |
            dist/GitHubReleaseTracker.exe
            dist/GitHubReleaseTracker.exe.sha256
            dist/release-notes-v*.md
          if-no-files-found: error
